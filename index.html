<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="app">
    <header class="app-header">
      <h1>To-do list</h1>
      <p id="today-date" class="today-date"></p>
    </header>

    <form id="task-form" class="task-form" novalidate>
      <label for="task-input" class="sr-only">New task</label>
      <input type="text" id="task-input" placeholder="What needs doing?" maxlength="120" autocomplete="off">
      <button type="submit" class="btn">Add task</button>
    </form>
    <p id="error-message" class="error-message" role="alert"></p>

    <section class="sheet" aria-label="Tasks">
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message"></p>
    </section>

    <footer class="app-footer">
      <p id="task-counter" class="task-counter" aria-live="polite"><span id="count-number">0</span> <span id="count-label">tasks left</span></p>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
      </div>

      <button type="button" id="clear-completed" class="link-btn">Clear completed</button>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
